# The canonical CCoE nginx.conf (core-platform/templates/nginx.conf), adapted:
# the API is reached SAME-ORIGIN through /api and /auth, so connect-src is
# 'self' only, and the session cookie never crosses an origin.
#
# Installed as a TEMPLATE (/etc/nginx/templates/): the image's entrypoint fills
# ${NGINX_LOCAL_RESOLVERS} with the network's DNS. The API name is re-resolved
# every second, and a connect to a vanished IP fails in 1 s instead of hanging
# 60 s: a restarted API (new IP) or another replica is picked up within ~2 s,
# without restarting nginx. Proven by the `C1 stateless` scenario.
server {
  listen 80;
  root /usr/share/nginx/html;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=1s ipv6=off;
  proxy_connect_timeout 1s;
  set $api http://deskbook-api:8080;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' blob: data:; frame-ancestors 'none'" always;

  location /api/ { proxy_pass $api; proxy_set_header Host $host; client_max_body_size 3m; }
  location /auth/ { proxy_pass $api; proxy_set_header Host $host; }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' blob: data:; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
