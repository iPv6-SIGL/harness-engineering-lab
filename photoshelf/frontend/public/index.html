<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoShelf</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>PhotoShelf</h1>
    <span id="who"></span>
    <a id="login" href="/auth/login">Sign in</a>
    <button id="logout" type="button" hidden>Sign out</button>
  </header>
  <main>
    <form id="find" aria-label="Product">
      <label>Product SKU <input id="sku" required pattern="[A-Za-z0-9-]{3,32}" placeholder="SHOE-042"></label>
      <button type="submit">Show</button>
    </form>
    <section id="upload" hidden>
      <h2>Upload a shoot</h2>
      <form id="send">
        <label>Raw photos (JPEG or PNG, up to 200, 20 MB each)
          <input id="files" type="file" accept="image/jpeg,image/png" multiple required>
        </label>
        <button type="submit">Upload</button>
      </form>
      <progress id="progress" value="0" max="1" hidden></progress>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section>
      <h2>On the shop <small>(what anonymous shop pages see)</small></h2>
      <ul id="shop" class="grid"></ul>
    </section>
    <section id="all" hidden>
      <h2>Every photo of this SKU</h2>
      <ul id="photos" class="grid"></ul>
    </section>
  </main>
</body>
</html>
