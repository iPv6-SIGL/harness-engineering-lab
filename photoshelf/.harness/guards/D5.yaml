# compiled from design.md D5 — the builder reads it, never edits it
id: D5
decision: Nothing unasked
serves:
  - "*"
owner: decide step · human-reviewed
forbid_import:
  - openai
  - "@anthropic-ai/sdk"
  - ai
  - "@ai-sdk/openai"
  - langchain
  - "@temporalio/client"
  - "@temporalio/worker"
  - "@temporalio/workflow"
forbid_pattern:
  - llm\.internal
  - api\.openai\.com
  - api\.anthropic\.com
  - task:(cheap|quality|vision|reasoning|embed|image)
  - temporal\.internal
  - "@temporalio/"
  - analytics\.internal
  - umami
  - data-website-id
forbid_env:
  - TEMPORAL_ADDRESS
forbid_service: []
forbid_path: []
forbid_flag:
  - LLM_VKEY
  - TEMPORAL_NS
  - ANALYTICS_SITE
witness:
  - probe: llm-consumer
    expect: absent
  - probe: temporal-namespace
    expect: absent
  - probe: analytics-site
    expect: absent