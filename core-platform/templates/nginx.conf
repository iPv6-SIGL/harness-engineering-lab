# The canonical nginx.conf — a CCoE SPA frontend.
# To be copied into frontend/nginx.conf; ONLY the CSP's `connect-src` (and the
# ports) adapt per app (the app's API + MinIO). The rest is not modified.
#
# ⚠ nginx: as soon as a `location` declares an `add_header`, it NO LONGER INHERITS
# the server-level `add_header`s. The security headers are therefore
# REPEATED in every location that adds a Cache-Control. Do not factor them out
# without an `include`, on pain of losing the CSP on index.html.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The security headers — MUST (server level: they apply to the locations WITH NO add_header)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8501 http://localhost:9000; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http://localhost:9000; frame-ancestors 'none'" always;
  # HSTS: to be enabled only behind TLS (production) — the workshop has no TLS
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Hashed bundles (index-XXXX.js/css): immutable → cached for life.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8501 http://localhost:9000; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http://localhost:9000; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html: NEVER cached — otherwise an open tab keeps loading the old bundle
  # after a deployment (calls to removed endpoints → 404).
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8501 http://localhost:9000; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http://localhost:9000; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # An SPA: every unknown route falls back onto index.html
  location / { try_files $uri $uri/ /index.html; }
}
