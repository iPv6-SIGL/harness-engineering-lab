<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GearUp</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>GearUp</h1>
    <span id="budget"></span>
    <span id="who"></span>
    <a id="login" href="/auth/login">Sign in</a>
    <button id="logout" type="button" hidden>Sign out</button>
  </header>
  <main id="app" hidden>
    <p id="message" role="status" aria-live="polite"></p>
    <section>
      <h2>Catalog</h2>
      <ul id="catalog" class="rows"></ul>
    </section>
    <section>
      <h2>My requests</h2>
      <ul id="mine" class="rows"></ul>
    </section>
    <section id="manager" hidden>
      <h2>My team's requests <small>(3 days to answer, a reminder after 2)</small></h2>
      <ul id="team" class="rows"></ul>
    </section>
  </main>
</body>
</html>
